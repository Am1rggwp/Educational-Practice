<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet">
    <title>Кейс №2</title>
</head>

<body>
    <div class="pos-container">
        <div class="container">
            <h2>Рассчет по дню рождения</h2>

            <div class="form-group">
                <div class="input-box">
                    <label>День</label>
                    <input type="number" id="day" min="1" max="31" placeholder="ДД">
                </div>
                <div class="input-box">
                    <label>Месяц</label>
                    <input type="number" id="month" min="1" max="12" placeholder="ММ">
                </div>
                <div class="input-box">
                    <label>Год</label>
                    <input type="number" id="year" min="1900" max="2026" placeholder="ГГГГ">
                </div>
            </div>
            <div class="pos-btn">
                <button class="btn-progress" onclick="processData()">Рассчитать и вывести</button>
            </div>
            

            <div class="error-msg" id="error">Пожалуйста, введите корректную дату!</div>

            <!-- Блок с результатами вычислений -->
            <div class="results">
                <div class="result-card">
                    <div class="label">День недели</div>
                    <div class="value" id="res-weekday">-</div>
                </div>
                <div class="result-card">
                    <div class="label">Високосный?</div>
                    <div class="value" id="res-leap">-</div>
                </div>
                <div class="result-card">
                    <div class="label">Полных лет</div>
                    <div class="value" id="res-age">-</div>
                </div>
            </div>

            <!-- Электронное табло -->
            <div class="led-board" id="led-board">
                <!-- Сюда JavaScript сгенерирует пиксели -->
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>

</html>
